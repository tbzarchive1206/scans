<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1746d1">
  <meta name="description" content="THE BOYZ fan-made scans archive">
  <title>Scans Archive — THE BOYZ Archive</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="collection" data-collection="membership-kits">
  <header class="masthead collection-masthead">
    <div class="utility">
      <a class="brand" href="../index.html">THE BOYZ / FAN ARCHIVE</a>
      <nav aria-label="Archive links">
        <a href="https://tbzarchive1206.github.io/tbzarchive/" target="_blank" rel="noopener noreferrer" data-i18n="mainArchive">MAIN ARCHIVE ↗</a>
        <span>/</span>
        <a href="https://x.com/tbzarchive1206_" target="_blank" rel="noopener noreferrer">TWITTER ↗</a>
        <button class="lang-toggle" id="langToggle" type="button" aria-label="Change language">EN</button>
      </nav>
    </div>
    <a class="back-link" href="../index.html">← <span data-i18n="backToScans">SCANS ARCHIVE</span></a>
    <h1 id="collectionTitle"><span class="solid">SCANS</span><span class="outline">ARCHIVE</span></h1>
    <div class="stats">
      <p><strong id="galleryCount">—</strong><br><span data-i18n="galleries">GALLERIES</span></p><i></i>
      <p><strong id="scanCount">—</strong><br><span data-i18n="scans">SCANS</span></p><i></i>
      <p><span data-i18n="updated">UPDATED</span><br><strong id="updatedDate">—</strong></p>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Gallery controls">
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchGalleries" placeholder="SEARCH GALLERIES..."></label>
      <div class="filter-row single-filter">
        <label><span data-i18n="sort">SORT</span><select id="sortFilter"><option value="source" data-i18n="sourceOrder">SOURCE ORDER</option><option value="newest" data-i18n="newest">NEWEST</option><option value="largest" data-i18n="largest">MOST SCANS</option><option value="az">A—Z</option></select></label>
      </div>
    </section>
    <section class="archive-section">
      <div class="results-head"><p id="resultsCount">—</p><a id="collectionDrive" class="source-link" href="#" target="_blank" rel="noopener noreferrer"><span data-i18n="openSource">OPEN SOURCE FOLDER</span> ↗</a></div>
      <div class="cards" id="cards"></div>
      <p class="empty" id="empty" hidden><strong>0</strong><span data-i18n="noResults">NO GALLERIES FOUND</span></p>
    </section>
  </main>

  <footer><a href="../index.html">← <span data-i18n="scansArchive">SCANS ARCHIVE</span></a><a href="#top" data-i18n="backTop">BACK TO TOP ↑</a></footer>

  <dialog id="galleryDialog" aria-labelledby="dialogTitle">
    <div class="gallery-shell">
      <header class="gallery-head">
        <div><div class="gallery-kicker" id="dialogKicker"></div><h2 id="dialogTitle"></h2></div>
        <div class="gallery-actions"><a id="dialogDrive" href="#" target="_blank" rel="noopener noreferrer"><span data-i18n="openFolder">OPEN FOLDER</span> ↗</a><button id="closeDialog" type="button" aria-label="Close">×</button></div>
      </header>
      <p class="gallery-note" data-i18n="downloadNote">USE “DOWNLOAD ↓” BELOW EACH SCAN TO SAVE THE ORIGINAL FILE.</p>
      <div id="pdfLinks" class="pdf-links" hidden></div>
      <div id="galleryGroups"></div>
    </div>
  </dialog>
  <script src="../data.js"></script>
  <script src="../gallery.js"></script>
</body>
</html>
